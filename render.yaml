services:
  - type: web
    name: studytask
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m flask --app app init-db
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
